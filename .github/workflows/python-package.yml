name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - name: Runtime diagnostics
        run: uv run --no-sync python -c "import sys, sqlite3; print(sys.version); print('SQLite', sqlite3.sqlite_version, 'threadsafety', sqlite3.threadsafety)"
      - name: Test
        run: uv run --no-sync pytest -q

  quality:
    name: Lint, typing, coverage, and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --dev --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy sqlitekvstore.py
      - run: uv run --no-sync mypy tests/typing_examples.py
      - run: uv run --no-sync python -m mypy.stubtest sqlitekvstore
      - run: uv run --no-sync pytest -q --cov=sqlitekvstore --cov-branch
      - run: uv build --out-dir artifacts
      - run: uv run --no-sync python scripts/check_distribution.py artifacts
